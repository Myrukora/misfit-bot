{{define "rd_login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Bot}} — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cookie&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v={{.AssetVersion}}">
</head>
<body class="login-page">
  <div class="login-stack">
  <div class="login-card">
    <div class="login-brand">
      {{if .BotAvatar}}<img class="login-avatar" src="{{.BotAvatar}}" alt="{{.Bot}}">{{else}}<span class="login-avatar login-avatar-fallback">{{initial .Bot}}</span>{{end}}
      <h1 class="login-title">{{.Bot}}</h1>
      <p class="login-sub muted">Bot dashboard</p>
    </div>
    <form class="login-form" action="/login" method="post">
      <button type="submit" class="btn login-btn">
        <img src="/static/discord.svg" width="22" height="22" alt="" aria-hidden="true">
        Sign in with Discord
      </button>
    </form>
    <p class="muted login-hint">
      Access is limited to members of a shared server.
    </p>
  </div>
  {{template "legal_links" .}}
  </div>
</body>
</html>
{{end}}
