{{define "admin"}}{{template "header" .}}
<h2>Administration</h2>
<p class="muted">Bot-wide configuration. Owner only — every change here affects all servers.</p>

{{range .Content.Sections}}
<section class="card">
  <h3>{{.Title}}</h3>
  {{if .Help}}<p class="muted section-help">{{.Help}}</p>{{end}}
  <form class="cfg-form core-form">
    {{range .Fields}}{{template "field" .}}{{end}}
    <div class="inline-form">
      <button type="button" class="btn btn-primary save-section">Save {{.Title}}</button>
    </div>
  </form>
</section>
{{end}}
{{template "footer" .}}{{end}}
