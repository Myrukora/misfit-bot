{{define "login"}}{{template "header" .}}
<div class="center-card">
  {{if .BotAvatar}}<img class="login-avatar" src="{{.BotAvatar}}" alt="">{{else}}<span class="hero-avatar hero-fallback login-avatar" style="display:flex">{{initial .Bot}}</span>{{end}}
  <h1>{{.Bot}}</h1>
  <p class="muted">Log in with Discord to manage your bot.</p>
  <form action="/login" method="post">
    <button class="btn btn-blurple" type="submit">Login with Discord</button>
  </form>
</div>
{{template "footer" .}}{{end}}
